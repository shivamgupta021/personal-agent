name: Controlled regressions
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: personal_agent
          POSTGRES_USER: personal_agent
          POSTGRES_PASSWORD: test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U personal_agent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_DB: personal_agent
      POSTGRES_USER: personal_agent
      POSTGRES_PASSWORD: test-only
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: '3.12'
      - name: Install extraction dependencies
        run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr
      - name: Install locked Python dependencies
        run: uv sync --locked --dev
      - name: Controlled behavioral regressions
        run: uv run pytest -q
      - name: Typecheck
        run: uv run mypy .
