[project]
name = "personal-agent"
version = "0.1.0"
description = "A terminal research agent using ChatGPT subscription access and local Firecrawl"
requires-python = ">=3.12"
dependencies = [
    "httpx2==2.16.2",
    "openai==3.52.0",
    "pydantic-ai-slim[openai]==2.69.0",
]

[dependency-groups]
dev = ["pytest==9.2.0", "mypy==2.4.1"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src", "tests"]
